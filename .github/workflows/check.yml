name: Check

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.3.0
        env:
          GH_TOKEN: ${{ github.token }}
      - run: gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: jdx/mise-action@v5.2.2
      - run: aube install
      - run: aubr build
      - run: aubr fmt:check
      - run: aubr lint
      - run: mise run test
      - run: mise run validate
      - run: git diff --exit-code
