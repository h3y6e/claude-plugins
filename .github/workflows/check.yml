name: Check

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.2
      - run: jactionlint
      - run: aube install
      - run: aubr build
      - run: aubr fmt:check
      - run: aubr lint
      - run: mise run test
      - run: mise run validate
      - run: git diff --exit-code
