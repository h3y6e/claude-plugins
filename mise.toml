[tools]
aube = "v2.9.0"
claude = "2.1.317"
imagemagick = "7.1.2_31"
jactionlint = "v2.4.0"
node = "26.13.0"

[tasks.test]
run = [
  "for m in mods/*/; do claude plugin test $m || exit 1; done",
  "node --test 'packages/*/src/*.test.ts'",
]

[tasks.validate]
run = "claude plugin validate . && for m in mods/*/; do claude plugin validate $m || exit 1; done"
